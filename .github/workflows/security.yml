name: Security Scan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sast:
    runs-on: ubuntu-22.04 # 固定系统版本，消除 Ubuntu 26 的 Notice
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Bandit
        run: pip install bandit
      - name: Run SAST (Bandit)
        run: bandit -r . -ll -ii -x ./.venv,./fix # 排除无关文件夹，防止误报

  sca:
    runs-on: ubuntu-22.04 # 固定系统版本，消除 Ubuntu 26 的 Notice
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run SCA (pip-audit)
        run: pip-audit -r requirements.txt
