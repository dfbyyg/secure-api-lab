name: Security Scan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo manually
        run: git clone https://github.com/${{ github.repository }}.git .
      - name: Install Bandit and Run
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install bandit
          bandit -r . -ll -ii -x ./.venv,./fix

  sca:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo manually
        run: git clone https://github.com/${{ github.repository }}.git .
      - name: Install pip-audit and Run
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install pip-audit
          pip3 install -r requirements.txt
          pip3-audit -r requirements.txt
