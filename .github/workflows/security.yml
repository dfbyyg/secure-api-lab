name: Security Scan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sast:
    runs-on: ubuntu-22.04 # 固定系统版本，消除 Ubuntu 26 的 Notice
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Bandit
        run: pip install bandit
      - name: Run SAST (Bandit)
        # 修改了这里：把扫描结果直接输出到 bandit-report.txt 文件中
        run: bandit -r . -lll -iii -x ./.venv,./fix -f txt -o bandit-report.txt
      - name: Upload SAST Report
        # 新增：上传报告
        uses: actions/upload-artifact@v6
        with:
          name: sast-report
          path: bandit-report.txt

  sca:
    runs-on: ubuntu-22.04 # 固定系统版本，消除 Ubuntu 26 的 Notice
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run SCA (pip-audit)
        # 修改了这里：把结果输出到文件。|| true 是为了防止扫描出漏洞时流水线变红中断（方便你拿到报告）
        run: pip-audit -r requirements.txt > sca-report.txt || true
      - name: Upload SCA Report
        # 新增：上传报告
        uses: actions/upload-artifact@v6
        with:
          name: sca-report
          path: sca-report.txt
